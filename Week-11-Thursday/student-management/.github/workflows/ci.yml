name: CI Pipeline - College Student Management System

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build, Test & Integration CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: student_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/student_management_test
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/student_management_test
      PORT: 5000
      HOST: 127.0.0.1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Backend Unit Tests
        working-directory: backend
        run: npm run test:unit

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Start Backend and Verify Health
        working-directory: backend
        run: |
          node server.js &
          SERVER_PID=$!
          echo "Started backend server with PID: $SERVER_PID"

          MAX_RETRIES=30
          COUNT=0
          HEALTH_URL="http://127.0.0.1:5000/api/health"

          until curl -s -f "$HEALTH_URL" > /dev/null; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Error: Backend server did not respond at $HEALTH_URL within timeout"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            echo "Waiting for backend health check ($COUNT/$MAX_RETRIES)..."
            sleep 1
          done

          echo "Backend health check verified successfully!"
          curl -s "$HEALTH_URL"
          echo ""

          # Terminate background server before Supertest integration tests
          kill $SERVER_PID 2>/dev/null || true

      - name: Run Integration Tests
        working-directory: backend
        run: npm run test:integration

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Generate Backend Coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Upload Test Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/
